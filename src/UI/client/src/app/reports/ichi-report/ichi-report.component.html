<div class="row mt-4 filters">
    <div class="col-lg-2">
      <div class="input-group mb-3">
        <div class="input-group-prepend">
          <label class="input-group-text" for="inputGroupSelect01">Symbol</label>
        </div>
        <select class="custom-select" id="inputGroupSelect01" [(ngModel)]="selected" >
          <option value="" selected>Choose...</option>
          <option vlaue="MSFT">MSFT</option>
          <option value="AAPL">AAPL</option>
        </select>
      </div>
    </div>
    <div class="col-lg-3">
      <div class="input-group mb-3">
        <div class="input-group-prepend">
          <label class="input-group-text" for="inputGroupSelect2">Date range</label>
        </div>
        <input id="inputGroupSelect2"
             placeholder="Date range"
             class="form-control"
             bsDaterangepicker
             [(ngModel)]="bsRangeValue">
      </div>
    </div>
    <div class="col-lg-1">
      <div class="input-group mb-3">
        <button class="form-control btn btn-secondary" (click)="onShowClick()">Show</button>
      </div>
    </div>
  </div>
  <div id="highcharts-container"></div>
  <div class="row" *ngIf="signals.length">
    <table class="table table-striped">
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Date</th>
        <th scope="col">Signal</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of signals; index as i">
        <th scope="row">{{ i + 1 }}</th>
        <td>
          {{ item.date }}
        </td>
        <td>{{ item.signal }}</td>
      </tr>
      </tbody>
    </table>
  </div>
